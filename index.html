<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>윷놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }

  #col { width:min(100%, 420px); }
  #wrap { position:relative; width:100%; }
  #panel { background:rgba(255,255,255,.16); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:8px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  #hud .item.score .value { font-size:17px; overflow:hidden; text-overflow:ellipsis; }
  .tray { width:100%; min-height:32px; display:flex; align-items:center; gap:8px; padding:2px 8px; background:#fff; border:3px solid var(--ink); border-radius:999px; font-size:13px; }
  .tray .who { white-space:nowrap; }
  .tray .toks { display:flex; gap:5px; flex:1; min-width:0; }
  .tray .done { margin-left:auto; white-space:nowrap; color:var(--muted); }
  .tok { width:22px; height:22px; border-radius:50%; border:3px solid var(--ink); padding:0; background:var(--c); box-shadow:0 2px 0 var(--ink); }
  .tok.can { cursor:pointer; animation:bob .7s ease-in-out infinite alternate; }
  .tok.empty { background:transparent; border-style:dashed; box-shadow:none; opacity:.35; }
  @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-3px); } }
  #boardWrap { width:min(100%, calc(100dvh - 340px)); aspect-ratio:1; background:#ffe6a8; border:3px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink); touch-action:manipulation; }
  #board { width:100%; height:100%; display:block; }
  #board .pc { transition:transform .32s cubic-bezier(.3,1.4,.5,1); }
  #board .pc circle.body { stroke:var(--ink); stroke-width:3; }
  #board .pc.can { cursor:pointer; }
  #board .pc.can circle.ring { animation:pulse .8s ease-in-out infinite alternate; }
  #board .pc text { font-family:inherit; font-size:12px; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none; paint-order:stroke; stroke:var(--ink); stroke-width:3px; }
  @keyframes pulse { from { opacity:.25; } to { opacity:1; } }
  #board .ghost { cursor:pointer; }
  #board .ghost text { font-family:inherit; font-size:10px; text-anchor:middle; dominant-baseline:central; fill:var(--ink); pointer-events:none; }
  #board .lbl { font-family:inherit; font-size:10px; fill:var(--muted); text-anchor:middle; pointer-events:none; }
  #sticksRow { width:100%; display:flex; align-items:center; justify-content:center; gap:14px; min-height:46px; }
  #sticks { display:flex; gap:7px; }
  .stick { width:15px; height:44px; border-radius:8px; border:3px solid var(--ink); background:#d9a35c; position:relative; box-shadow:0 3px 0 var(--ink); transition:background .1s; }
  .stick.flat { background:#fff1c9; }
  .stick.flat::after { content:''; position:absolute; left:2px; right:2px; top:6px; bottom:6px; background:repeating-linear-gradient(#b9893f 0 3px, transparent 3px 8px); border-radius:3px; }
  .stick.toss { animation:toss .55s ease-in-out; }
  @keyframes toss { 0% { transform:translateY(0) rotateX(0); } 40% { transform:translateY(-26px) rotateX(540deg); } 100% { transform:translateY(0) rotateX(1080deg); } }
  #resName { min-width:84px; font-size:34px; line-height:1; color:#fff; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 4px 0 var(--ink); }
  #resName.pop { animation:pop .3s ease-out; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  #msg { min-height:20px; font-size:14.5px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; }
  #chips { width:100%; min-height:34px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
  .chip { font:inherit; font-size:16px; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:999px; padding:1px 14px; box-shadow:0 3px 0 var(--ink); cursor:pointer; }
  .chip small { font-size:11px; color:var(--muted); margin-left:2px; }
  .chip.sel { background:var(--yellow); }
  #actions { display:flex; gap:8px; width:100%; justify-content:center; }
  #throwBtn { font:inherit; font-size:20px; color:var(--ink); background:#4cd964; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:6px 34px; cursor:pointer; }
  #throwBtn:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #throwBtn:disabled { opacity:.45; cursor:default; background:#c9c3dc; }
  #throwBtn.go { animation:glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow:0 4px 0 var(--ink); } to { box-shadow:0 4px 0 var(--ink), 0 0 12px 3px rgba(76,217,100,.85); } }
  @media (max-height:700px) {
    #panel { gap:3px; padding:6px; } .tray { min-height:28px; } .stick { height:36px; } #sticksRow { min-height:40px; }
    #resName { font-size:28px; } #throwBtn { padding:4px 30px; font-size:18px; } .chip { font-size:14px; }
    #boardWrap { width:min(100%, calc(100dvh - 320px)); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="value" id="turn">윷놀이</span></div>
      <div class="item"><span class="label">WIN</span><span class="value" id="wins">0</span></div>
      <div class="icons">
        <button id="muteBtn" title="소리 (M)">🔊</button>
      </div>
    </div>
    <div id="wrap">
      <div id="panel">
        <div class="tray" id="trayOp"></div>
        <div id="boardWrap"><svg id="board" viewBox="0 0 320 320" aria-label="윷판"></svg></div>
        <div class="tray" id="trayMe"></div>
        <div id="sticksRow"><div id="sticks"></div><div id="resName"></div></div>
        <div id="msg"></div>
        <div id="chips"></div>
        <div id="actions"><button id="throwBtn">🎲 던지기</button></div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
